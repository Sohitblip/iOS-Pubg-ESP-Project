name: Build PUBG iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos Environment
      uses: theos/setup-theos-action@v1
      with:
        theos-src: 'https://github.com'

    - name: Download iOS SDK
      run: |
        curl -LO https://github.com
        mkdir -p $THEOS/sdks
        tar -xf iPhoneOS14.5.sdk.tar.xz -C $THEOS/sdks/
        rm iPhoneOS14.5.sdk.tar.xz

    - name: Compile Tweak via Theos
      run: |
        make package FINALPACKAGE=1
        
    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: PUBG-ESP-Package
        path: .theos/obj/debug/*.dylib
