name: Build PUBG iOS dylib

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Theos Environment
      run: |
        # Force clean clone of theos repository
        git clone --recursive https://github.com /Users/runner/theos
        
        # Download and extract patches/SDK needed for modern building
        curl -LO https://github.com
        mkdir -p /Users/runner/theos/sdks
        tar -xf iPhoneOS14.5.sdk.tar.xz -C /Users/runner/theos/sdks/
        rm iPhoneOS14.5.sdk.tar.xz
        
        # Set environment variable safely
        echo "THEOS=/Users/runner/theos" >> $GITHUB_ENV

    - name: Compile Tweak via Theos
      run: |
        export THEOS=/Users/runner/theos
        make package FINALPACKAGE=1
        
    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: PUBG-ESP-Package
        path: .theos/obj/debug/*.dylib
